name: update data

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 UTC (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests
          pip install pytrends yfinance || true   # optional feeds; pipeline degrades gracefully without them

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
        run: python3 pipeline.py

      - name: Commit refreshed data
        run: |
          git config user.name "btc-desk-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
