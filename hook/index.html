:root {
  /* layout: one phone-width column. Top half is the water where the fight plays out,
     bottom half is the chart you steer on, and a wooden plank between them carries the readouts. */
  --ink: #2a1a12;
  --parch: #f3e2b3;
  --parch-deep: #e2c98d;
  --wood: #8f5d30;
  --gold: #ffd24a;
  --bull: #58c96b;
  --bear: #e5574d;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: Nunito, "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #1c120a; color: var(--ink); font-family: var(--font-body); font-weight: 800;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#stage { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; background: #3a2312; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }

#topbtns { position: absolute; top: 8px; right: 8px; display: flex; gap: 8px; }
.rbtn {
  width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--wood); color: #fff7df;
  display: grid; place-items: center; padding: 0; cursor: pointer; box-shadow: inset 0 3px 0 rgba(255,255,255,.28), inset 0 -4px 0 rgba(42,26,18,.3), 0 3px 0 var(--ink);
}
.rbtn svg { width: 22px; height: 22px; }
.rbtn:active { transform: translateY(2px); box-shadow: inset 0 3px 0 rgba(255,255,255,.28), inset 0 -4px 0 rgba(42,26,18,.3), 0 1px 0 var(--ink); }
.rbtn:disabled { opacity: .45; }
.rbtn.off .wave { display: none; }
.rbtn:not(.off) .mute { display: none; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

#toast {
  position: absolute; left: 50%; top: 56px; transform: translate(-50%, -8px); max-width: 86%; padding: 6px 12px; border-radius: 12px;
  background: var(--ink); color: #fff7df; font-size: 12.5px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.card {
  position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: min(88%, 344px); padding: 18px 16px 16px;
  background: var(--parch); border: 3px solid var(--ink); border-radius: 18px; text-align: center;
  box-shadow: inset 0 0 0 4px var(--parch-deep), 0 6px 0 var(--ink), 0 18px 34px rgba(12,7,3,.5);
  max-height: 96%; overflow-y: auto;
  animation: pop .28s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop { from { transform: translate(-50%, -46%) scale(.9); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } #toast { transition: none; } }

.logo { margin: 0 auto; width: min(82%, 250px); }
.logo svg { display: block; width: 100%; height: auto; overflow: visible; }
.tag { margin: 12px 0 10px; font-size: 15px; font-weight: 900; }
.how { margin: 0 0 10px; padding: 0; list-style: none; display: grid; gap: 6px; text-align: left; font-size: 13.5px; line-height: 1.3; counter-reset: s; }
.how li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; }
.how li::before { content: counter(s); font-family: var(--font-display); font-weight: 400; font-size: 15px; color: #fff7df; background: var(--wood); border: 2px solid var(--ink); border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; }
.how b { font-weight: 900; color: #9b3a1e; }
.note { margin: 8px 2px 12px; font-size: 11.5px; line-height: 1.35; font-weight: 800; color: rgba(42,26,18,.72); }

.btn {
  font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .4px; color: #fff7df; background: var(--bull);
  border: 3px solid var(--ink); border-radius: 14px; padding: 8px 26px 11px; cursor: pointer;
  text-shadow: 0 2px 0 rgba(42,26,18,.55); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -5px 0 #2f8f46, 0 5px 0 var(--ink);
}
.btn:active { transform: translateY(3px); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -5px 0 #2f8f46, 0 2px 0 var(--ink); }
.btn.small { font-size: 15px; padding: 5px 14px 7px; border-width: 2.5px; border-radius: 11px; background: var(--wood); box-shadow: inset 0 3px 0 rgba(255,255,255,.28), inset 0 -4px 0 #5e3a1c, 0 4px 0 var(--ink); }

.ribbon {
  display: inline-block; margin: -40px 0 4px; padding: 4px 20px 7px; font-family: var(--font-display); font-weight: 400; font-size: 25px; color: #fff7df;
  background: var(--bear); border: 3px solid var(--ink); border-radius: 12px; text-shadow: 0 2px 0 rgba(42,26,18,.6); box-shadow: inset 0 3px 0 rgba(255,255,255,.3), 0 4px 0 var(--ink);
  transform: rotate(-2deg);
}
.lost .ribbon { background: #7a6a58; }
#resFish { width: 100%; height: auto; max-height: 118px; display: block; margin: 2px auto 0; }
#resName { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.chips { margin: 7px 0 10px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.chip { font-size: 11px; font-weight: 900; padding: 2px 9px 3px; border-radius: 99px; border: 2px solid var(--ink); background: #fff7df; }
.chip.bull { background: #c9f0cf; } .chip.bear { background: #f9cfc9; }
.chip.t0 { background: #d9f2ff; } .chip.t1 { background: #b6e4ff; } .chip.t2 { background: #ffe58a; } .chip.t3 { background: #ffbd82; } .chip.t4 { background: #ff9a8f; }
#resStats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 4px; }
#resStats div { background: #fff7df; border: 2px solid var(--ink); border-radius: 10px; padding: 5px 2px 6px; }
#resStats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 18px; line-height: 1.15; font-variant-numeric: tabular-nums; }
#resStats b.gold { color: #b87a08; }
#resStats small { display: block; font-size: 10px; font-weight: 900; color: rgba(42,26,18,.62); text-transform: uppercase; letter-spacing: .4px; }

.sheet { position: absolute; inset: 0; background: var(--parch); border: 3px solid var(--ink); padding: 14px 12px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; }
#jGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cell { background: #fff7df; border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 6px 8px; text-align: center; box-shadow: 0 3px 0 var(--ink); }
.cell canvas { width: 100%; height: auto; display: block; }
.cell b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 15px; line-height: 1.15; }
.cell small { display: block; font-size: 10.5px; font-weight: 800; color: rgba(42,26,18,.65); margin-top: 2px; }
.cell.unknown { background: var(--parch-deep); box-shadow: none; }
.cell.unknown b { color: rgba(42,26,18,.55); }

</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="Fishing scene above a one-second Bitcoin chart"></canvas>
  <div id="topbtns">
    <button id="btnJournal" class="rbtn" type="button" aria-label="Open the catch journal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 5.5c2.5-1.5 5.5-1.5 8 0v13c-2.5-1.5-5.5-1.5-8 0-2.5-1.5-5.5-1.5-8 0z"/><path d="M12 5.5v13"/></svg>
    </button>
    <button id="btnSound" class="rbtn" type="button" aria-label="Turn sound off" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <section id="startCard" class="card" aria-labelledby="ttl">
    <h1 id="ttl" class="logo" aria-label="Hook the Price">
      <svg viewBox="0 0 300 150" role="img" aria-hidden="true">

    var er = clamp(len * 0.055, 2.1, 6), ex = len * (sh.blunt ? 0.26 : 0.31), ey = -Hh * (sh.blunt ? 0.02 : 0.14);

    circ(ex + er * 0.22, ey + (o.scared ? -er * 0.1 : er * 0.05), er * (o.scared ? 0.38 : 0.52)); c.fillStyle = INK; c.fill();

  }

/* ---- the water: sky, sea, dock, angler, fish ---- */
function waveY(x, t, s) { var A = (1.2 + 5.4 * s) * u; return L.surf + A * Math.sin(x * 0.034 + t * 1.6) + A * 0.5 * Math.sin(x * 0.075 - t * 2.4); }

function cloud(x, y, k, fill, edge) {
  var r = 9 * u * k;
  blob([[x - r * 1.5, y, r * 0.8], [x - r * 0.5, y - r * 0.55, r * 1.05], [x + r * 0.7, y - r * 0.25, r * 0.95], [x + r * 1.6, y + r * 0.05, r * 0.7], [x, y + r * 0.1, r * 0.9]], fill, 1.6 * u, edge);
}

function drawBackdrop(s, t) {
  var i, g = c.createLinearGradient(0, 0, 0, L.surf + 10);

  c.fillStyle = g; c.fillRect(-12, -12, W + 24, L.surf + 34);
  if (s < 0.95) {                                       // sun
    var sx = W * 0.43, sy = L.surf * 0.40, a = 1 - s;
    c.globalAlpha = a * 0.28; circ(sx, sy, 27 * u); c.fillStyle = '#fff3b0'; c.fill();
    c.globalAlpha = a; circ(sx, sy, 17 * u); c.fillStyle = '#ffe170'; c.fill(); inkLine(2 * u, 'rgba(160,110,20,0.75)');

  for (i = 0; i < cl.length; i++) {
    var span = W + 150 * u, cx = ((cl[i][0] * span + t * cl[i][3] * (1 + 3 * s)) % span) - 75 * u;
    cloud(cx, L.surf * cl[i][1], cl[i][2] * (1 + 0.5 * s), cf, ce);
  }
  if (s > 0.55) { cloud(W * 0.3, L.surf * 0.1, 1.9, mix('#77838e', '#4b5560', s), ce); cloud(W * 0.72, L.surf * 0.06, 2.1, mix('#77838e', '#434c56', s), ce); }
  // far hills
  c.beginPath(); c.moveTo(-5, L.surf + 12);
  for (var x = -5; x <= W + 5; x += 9) c.lineTo(x, L.surf - (15 + 9 * Math.sin(x * 0.013 + 0.6) + 5 * Math.sin(x * 0.034 + 2)) * u);
  c.lineTo(W + 5, L.surf + 12); c.closePath(); c.fillStyle = mix('#9ad88f', '#74897b', s); c.fill(); inkLine(2 * u);
  // near hill with a lighthouse

  c.beginPath(); c.moveTo(W * 0.62, L.surf + 12); c.quadraticCurveTo(W * 0.72, hy - 8 * u, hx, hy); c.quadraticCurveTo(W * 1.0, hy + 2 * u, W + 12, L.surf - 8 * u); c.lineTo(W + 12, L.surf + 12); c.closePath();
  c.fillStyle = mix('#5fb868', '#4c6c5b', s); c.fill(); inkLine(2.2 * u);
  var bush = mix('#3f9a4f', '#39574a', s);
  blob([[W * 0.72, L.surf - 16 * u, 6 * u], [W * 0.745, L.surf - 20 * u, 7 * u], [W * 0.77, L.surf - 16 * u, 5.5 * u]], bush, 1.8 * u);
  blob([[W * 0.965, L.surf - 22 * u, 6.5 * u], [W * 0.99, L.surf - 25 * u, 7 * u]], bush, 1.8 * u);
  var lw = 5.2 * u, lt = 3.6 * u, lh = 25 * u, lx = hx + 2 * u, ly = hy + 2 * u;
  c.beginPath(); c.moveTo(lx - lw, ly); c.lineTo(lx - lt, ly - lh); c.lineTo(lx + lt, ly - lh); c.lineTo(lx + lw, ly); c.closePath(); c.fillStyle = '#fff4e2'; c.fill();
  c.save(); c.clip(); c.fillStyle = '#e5574d'; c.fillRect(lx - lw, ly - lh * 0.42, lw * 2, lh * 0.2); c.fillRect(lx - lw, ly - lh * 0.86, lw * 2, lh * 0.18); c.restore();
  c.beginPath(); c.moveTo(lx - lw, ly); c.lineTo(lx - lt, ly - lh); c.lineTo(lx + lt, ly - lh); c.lineTo(lx + lw, ly); c.closePath(); inkLine(1.7 * u);
  var beam = s > 0.3 ? 0.5 + 0.5 * Math.sin(t * 2.2) : 0;
  if (beam > 0) { c.globalAlpha = 0.35 * beam * s; circ(lx, ly - lh - 4 * u, 13 * u); c.fillStyle = '#ffe98a'; c.fill(); c.globalAlpha = 1; }

  c.beginPath(); c.moveTo(lx - lt - 2.5 * u, ly - lh - 7 * u); c.lineTo(lx, ly - lh - 15 * u); c.lineTo(lx + lt + 2.5 * u, ly - lh - 7 * u); c.closePath(); c.fillStyle = '#d6453c'; c.fill(); inkLine(1.6 * u);

function drawSea(s, t) {
  var x, i;

  for (x = -6; x <= W + 6; x += 7) c.lineTo(x, waveY(x, t, s));
  c.lineTo(W + 6, L.sceneH + 6); c.lineTo(-6, L.sceneH + 6); c.closePath();

  for (i = 0; i < 3; i++) {
    c.globalAlpha = 0.075 * (1 - s) * (0.7 + 0.3 * Math.sin(t * 0.7 + i * 2));

    c.beginPath(); c.moveTo(x0, L.surf); c.lineTo(x0 + 26 * u, L.surf); c.lineTo(x0 - 30 * u, L.sceneH); c.lineTo(x0 - 78 * u, L.sceneH); c.closePath(); c.fill();

  for (x = -6; x <= W + 6; x += 9) c.lineTo(x, L.bed - (4 * Math.sin(x * 0.021 + 1) + 2.5 * Math.sin(x * 0.06)) * u);
  c.lineTo(W + 6, L.sceneH + 6); c.closePath(); c.fillStyle = mix('#c9bd8a', '#6f7f78', s * 0.7); c.fill(); inkLine(2.2 * u);
  // rocks
  blob([[W * 0.53, L.bed - 2 * u, 9 * u], [W * 0.565, L.bed - 6 * u, 7 * u], [W * 0.50, L.bed + 1 * u, 6 * u]], '#6d8aa3', 2 * u);
  blob([[W * 0.94, L.bed - 3 * u, 8 * u], [W * 0.985, L.bed - 1 * u, 7 * u]], '#5f7c95', 2 * u);
  // a sunken chest
  var kx = W * 0.775, ky = L.bed - 3 * u;
  c.save(); c.translate(kx, ky); c.rotate(-0.12);
  rr(-11 * u, -10 * u, 22 * u, 13 * u, 2 * u); fillInk('#8a5a2e', 2 * u);
  c.beginPath(); c.moveTo(-11 * u, -10 * u); c.quadraticCurveTo(0, -21 * u, 11 * u, -10 * u); c.closePath(); fillInk('#a06a36', 2 * u);
  c.fillStyle = '#f0b429'; c.fillRect(-2.5 * u, -15 * u, 5 * u, 17 * u); c.strokeStyle = INK; c.lineWidth = 1.4 * u; c.strokeRect(-2.5 * u, -15 * u, 5 * u, 17 * u);
  c.restore();

  for (i = 0; i < weeds.length; i++) {

    inkLine(7.2 * u); c.strokeStyle = weeds[i][2]; c.lineWidth = 4.2 * u; c.stroke();

    var fy = L.surf + (L.bed - L.surf) * (0.3 + i * 0.22) + Math.sin(t * 1.3 + i * 2) * 5 * u;
    drawFish(fx, fy, (11 + i * 2) * u, SPECIES[0], t + i, { sil: 'rgba(10,50,90,0.22)', line: 'rgba(0,0,0,0)', right: dir > 0, wag: 0.7, wagSpeed: 10 });
  }
}

function drawDock(s, t) {
  var posts = [L.dockEnd - 9 * u, L.dockEnd * 0.42], i, pw = 9 * u;
  for (i = 0; i < posts.length; i++) {
    var px = posts[i] - pw / 2, wy = waveY(posts[i], t, s);
    c.fillStyle = '#845428'; c.fillRect(px, L.deckY + 4 * u, pw, wy - L.deckY);
    c.fillStyle = mix('#3f6f8c', '#2f4a5c', s); c.fillRect(px, wy, pw, L.bed - wy + 4 * u);
    c.strokeStyle = INK; c.lineWidth = 2.2 * u; c.strokeRect(px, L.deckY + 4 * u, pw, L.bed - L.deckY);
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 1.6 * u; c.beginPath(); c.moveTo(px - 3 * u, wy + 1); c.lineTo(px + pw + 3 * u, wy + 1); c.stroke();
  }

  for (i = 1; i < 5; i++) { var nx = (L.dockEnd + 6 * u) * i / 5; c.beginPath(); c.moveTo(nx, L.deckY + 1.5 * u); c.lineTo(nx, L.deckY + 9.5 * u); inkLine(1.3 * u, 'rgba(42,26,18,0.55)'); }
  // lantern post
  var px2 = L.dockEnd * 0.13;
  c.beginPath(); c.moveTo(px2, L.deckY); c.lineTo(px2, L.deckY - 38 * u); c.lineTo(px2 + 11 * u, L.deckY - 38 * u); inkLine(5.4 * u); c.strokeStyle = '#7a4a25'; c.lineWidth = 2.8 * u; c.stroke();
  var glow = 0.25 + 0.75 * s;
  c.globalAlpha = 0.3 * glow; circ(px2 + 11 * u, L.deckY - 29 * u, 13 * u); c.fillStyle = '#ffe98a'; c.fill(); c.globalAlpha = 1;
  rr(px2 + 7 * u, L.deckY - 36 * u, 8 * u, 11 * u, 2 * u); fillInk(mix('#ffe9a0', '#ffd24a', s), 1.8 * u);
  // creel (bucket); a tail pokes out once you have caught something

  c.beginPath(); c.moveTo(bx - bw / 2, L.deckY - bh); c.lineTo(bx + bw / 2, L.deckY - bh); c.lineTo(bx + bw / 2 - 2.5 * u, L.deckY); c.lineTo(bx - bw / 2 + 2.5 * u, L.deckY); c.closePath(); fillInk('#a8743a', 2 * u);

}

function anglerHand(lean) {            // world position of the rod hand
  var px = L.seatX, py = L.seatY - 4 * u, lx = 17 * u, ly = -17 * u, ca = Math.cos(lean), sa = Math.sin(lean);
  return [px + lx * ca - ly * sa, py + lx * sa + ly * ca];
}
function rodTip() {
  var b = S.bend;
  return [L.tipX + b * 9 * u + S.pull * 6 * u, L.tipY + b * 30 * u];
}

function drawAngler(t) {
  var sx = L.seatX, sy = L.seatY, lean = S.lean, i, mood = S.mood;
  // legs over the edge
  for (i = 0; i < 2; i++) {
    var sw = Math.sin(t * 2.2 + i * 1.6) * 2.2 * u * (mood === 'strain' ? 0.2 : 1), kx = L.dockEnd + (2 + i * 4.5) * u;
    c.beginPath(); c.moveTo(sx - 3 * u + i * 4 * u, sy - 3 * u); c.lineTo(kx, sy - 3 * u); c.lineTo(kx + 2 * u + sw, sy + 12 * u);
    inkLine(8.6 * u); c.strokeStyle = '#6f4a2b'; c.lineWidth = 5.2 * u; c.stroke();
    c.beginPath(); c.ellipse(kx + 4.5 * u + sw, sy + 14 * u, 6 * u, 3.6 * u, 0, 0, 6.2832); fillInk('#3a2a1f', 2 * u);
  }
  c.save(); c.translate(sx, sy - 4 * u); c.rotate(lean);
  // tunic
  c.beginPath(); c.ellipse(-1 * u, -12 * u, 12.5 * u, 14.5 * u, 0, 0, 6.2832); fillInk('#3f7fd1', 2.5 * u);
  c.beginPath(); c.arc(-1 * u, -12 * u, 9 * u, 2.6, 3.9); inkLine(2 * u, 'rgba(255,255,255,0.35)');
  c.beginPath(); c.moveTo(-12 * u, -4.5 * u); c.quadraticCurveTo(-1 * u, -1 * u, 10.5 * u, -5 * u); inkLine(3.4 * u, '#5e3a1c');
  rr(-3 * u, -6.6 * u, 5 * u, 5 * u, 1 * u); fillInk('#ffd24a', 1.4 * u);
  // head

  blob([[hx + 3 * u, hy + 8.5 * u, 6.2 * u], [hx - 3.5 * u, hy + 7 * u, 5.2 * u], [hx + 8.5 * u, hy + 6.5 * u, 4.6 * u], [hx + 3 * u, hy + 13 * u, 4.2 * u]], '#e2792a', 2 * u);
  c.beginPath(); c.ellipse(hx + 11 * u, hy + 0.5 * u, 5.2 * u, 4.3 * u, 0, 0, 6.2832); fillInk('#eeaa7c', 2 * u);
  var blink = (t % 3.7) < 0.12;
  if (mood === 'cheer') { c.beginPath(); c.arc(hx + 5.5 * u, hy - 3 * u, 2.4 * u, 3.5, 5.9); inkLine(2 * u); }
  else if (mood === 'bite') { circ(hx + 5.5 * u, hy - 4 * u, 2.6 * u); c.fillStyle = '#fff'; c.fill(); inkLine(1.6 * u); circ(hx + 6 * u, hy - 4 * u, 1.1 * u); c.fillStyle = INK; c.fill(); }
  else if (blink || mood === 'sad') { c.beginPath(); c.moveTo(hx + 3.5 * u, hy - 3.6 * u); c.lineTo(hx + 7.5 * u, hy - 3.6 * u); inkLine(1.9 * u); }
  else { circ(hx + 5.6 * u, hy - 4 * u, 1.7 * u); c.fillStyle = INK; c.fill(); }
  var br = mood === 'strain' ? 0.5 : mood === 'sad' ? -0.45 : 0.08;
  c.save(); c.translate(hx + 5.5 * u, hy - 8.3 * u); c.rotate(br); c.beginPath(); c.moveTo(-3.6 * u, 0); c.lineTo(3.6 * u, 0); inkLine(2.2 * u); c.restore();

  c.beginPath(); c.moveTo(hx - 10 * u, hy - 9 * u); c.quadraticCurveTo(hx - 9 * u, hy - 25 * u, hx + 1 * u, hy - 25 * u); c.quadraticCurveTo(hx + 12 * u, hy - 24 * u, hx + 12 * u, hy - 9 * u); c.closePath(); fillInk('#5fa347', 2.4 * u);
  c.beginPath(); c.moveTo(hx - 10 * u, hy - 12.5 * u); c.lineTo(hx + 12 * u, hy - 12.5 * u); inkLine(3.6 * u, '#c9452f');
  c.beginPath(); c.ellipse(hx + 1.5 * u, hy - 9 * u, 18.5 * u, 4.4 * u, -0.05, 0, 6.2832); fillInk('#4f8f3c', 2.4 * u);
  c.beginPath(); c.moveTo(hx - 6 * u, hy - 14 * u); c.quadraticCurveTo(hx - 17 * u, hy - 20 * u, hx - 19 * u, hy - 31 * u); c.quadraticCurveTo(hx - 9 * u, hy - 26 * u, hx - 6 * u, hy - 14 * u); c.closePath(); fillInk('#ffcf3d', 1.7 * u);
  // arm

  c.beginPath(); c.moveTo(3 * u, -19 * u); c.quadraticCurveTo(10 * u, -13 * u, ax, ay); inkLine(8.4 * u); c.strokeStyle = '#3f7fd1'; c.lineWidth = 5 * u; c.stroke();
  circ(ax, ay, 3.8 * u); fillInk('#f4c79c', 2 * u);

    var e = S.emote, k = Math.min(1, e.t / 0.12), ex = sx + 8 * u, ey = sy - 76 * u;
    c.save(); c.translate(ex, ey); c.scale(k, k); c.rotate(-0.12);
    c.beginPath(); for (i = 0; i < 16; i++) { var rad = i % 2 ? 9.5 * u : 15 * u, an = i / 16 * 6.2832; c.lineTo(Math.cos(an) * rad, Math.sin(an) * rad); } c.closePath(); fillInk(e.type === '!' ? '#ffd24a' : '#fff7df', 2.2 * u);

    c.globalAlpha = 1;
  }
}

function drawRodAndLine(t, target) {     // target: [x, y] the line runs to, or null
  var hand = anglerHand(S.lean), tip = rodTip();
  var bx = hand[0] - 11 * u, by = hand[1] + 9 * u;
  var cx = lerp(hand[0], L.tipX, 0.62), cy = lerp(hand[1], L.tipY, 0.62);
  c.beginPath(); c.moveTo(bx, by); c.lineTo(hand[0], hand[1]); c.quadraticCurveTo(cx, cy, tip[0], tip[1]);
  inkLine(5 * u); c.strokeStyle = '#b07a3c'; c.lineWidth = 2.6 * u; c.stroke();

function drawScene() {

  } else if (S.state === 'landed' && sp) {

    var hang = p >= 1 ? Math.sin(t * 13) * 0.2 * Math.max(0, 1 - (S.t - 0.62) / 1.4) : 0;
    fishDraw = { x: lerp(S.from[0], hx, p), y: lerp(S.from[1], hy, p) - Math.sin(p * 3.1416) * 40 * u, rot: p < 1 ? lerp(-0.3, 1.5708, p) : 1.5708 + hang, o: { wag: 1, wagSpeed: 18 }, front: true };
  } else if (S.state === 'lost' && sp) {

  }

  inkLine(3 * u, 'rgba(255,255,255,0.9)');

    for (i = 0; i < 46; i++) { var rx = ((i * 97 + t * 190) % (W + 50)) - 25, ry = ((i * 61 + t * 560) % (L.sceneH * 0.9)); c.moveTo(rx, ry); c.lineTo(rx - 3.5 * u, ry + 11 * u); }
    c.stroke();

function niceStep(x) {
  var p = Math.pow(10, Math.floor(Math.log(x) / Math.LN10)), n = x / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

function drawChart() {
  c.drawImage(stat.chart, 0, L.chartY, W, L.chartH);
  if (isNaN(market.price)) return;
  var f = S.fight, fighting = S.state === 'fight' && f, i, y, p, left = L.plotX + 58 * u;
  c.save(); rr(L.ix + 1, L.iy + 1, L.iw - 2, L.ih - 2, 4 * u); c.clip();
  // price grid, like depth lines on a sea chart
  var half = market.half, step = niceStep(half * 2 / 4), p0 = Math.ceil((market.center - half * 1.1) / step) * step;
  c.lineWidth = 1 * u; c.setLineDash([]);
  for (p = p0; p < market.center + half * 1.1; p += step) {
    y = yPix(market.norm(p));
    c.strokeStyle = 'rgba(42,26,18,0.16)'; c.beginPath(); c.moveTo(L.plotX + 3 * u, y); c.lineTo(L.chanX, y); c.stroke();
    plain(step >= 1 ? Math.round(p).toLocaleString('en-US') : p.toFixed(step < 0.1 ? 2 : 1), L.plotX + 6 * u, y - 3 * u, { size: 9.5 * u, fill: 'rgba(42,26,18,0.5)' });
  }

    c.strokeStyle = f.on ? 'rgba(47,143,70,0.55)' : 'rgba(42,26,18,0.3)'; c.lineWidth = 1.3 * u; c.setLineDash([4 * u, 4 * u]);

  c.beginPath(); c.moveTo(left, L.iy + 4 * u); c.lineTo(left, L.iy + L.ih - 4 * u); inkLine(1.3 * u, 'rgba(42,26,18,0.28)');   // the price axis; old candles slip behind it

  c.beginPath(); c.moveTo(L.plotX, yp); c.lineTo(L.chanX + L.chanW, yp); c.stroke(); c.setLineDash([]);
  var tag = market.price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  c.font = '900 ' + 10.5 * u + 'px ' + F_BODY; var tw = c.measureText(tag).width + 10 * u;

  plain(tag, L.plotX + 8 * u, clamp(yp - 8.5 * u, L.iy + 3 * u, L.iy + L.ih - 20 * u) + 12.3 * u, { size: 10.5 * u, weight: '900', fill: '#fff7df' });

  // the channel: your net and the fish
  var cx = L.chanX + L.chanW / 2;
  if (fighting) {
    var bx = L.chanX + 8 * u, bwid = L.chanW - 16 * u, t1 = yPix(f.pos + f.half), t2 = yPix(f.pos - f.half), low = f.meter < 0.25;
    if (f.on) { rr(bx - 2.5 * u, t1 - 2.5 * u, bwid + 5 * u, t2 - t1 + 5 * u, 12 * u); c.fillStyle = 'rgba(255,210,74,' + (0.55 + 0.25 * Math.sin(T * 10)).toFixed(2) + ')'; c.fill(); }

  $('resRibbon').textContent = won ? (r.perfect ? 'Perfect catch!' : 'Landed!') : 'It got away';
  $('resName').textContent = r.sp.name;
  $('resSub').innerHTML = '<span class="chip t' + r.tier + '">' + TIERS[r.tier].name + ' sea</span><span class="chip ' + (r.sp.mood > 0 ? 'bull' : 'bear') + '">' + (r.sp.mood > 0 ? 'Price rising' : 'Price falling') + '</span>';
  var acc = Math.round(r.acc * 100) + '%';
  if (won) {
    $('resStats').innerHTML = '<div><b>' + fmtKg(r.kg) + '</b><small>weight</small></div><div><b>' + acc + '</b><small>net on fish</small></div><div><b class="gold">+' + r.gold + '</b><small>gold</small></div>';
    var notes = [];
    if (r.isNew) notes.push('New species for your journal.'); else if (r.isRecord) notes.push('Your heaviest ' + r.sp.name + ' yet.');
    if (r.streak >= 2) notes.push(r.streak + ' in a row: gold x' + r.bonus.toFixed(1) + '.');
    notes.push('Bitcoin swung ' + fmtMoney(r.swing) + ' during the ' + r.time.toFixed(0) + ' s fight.');
    $('resNote').textContent = notes.join(' ');
    for (var i = 0; i < 3; i++) setTimeout(function (j) { return function () { sfx.coin(j); }; }(i), 80);
  } else {
    $('resStats').innerHTML = '<div><b>' + acc + '</b><small>net on fish</small></div><div><b>' + r.time.toFixed(0) + ' s</b><small>fight</small></div><div><b>' + fmtMoney(r.swing) + '</b><small>price swing</small></div>';
    $('resNote').textContent = r.tier >= 3 ? 'Rough seas shrink the net. Tap in short bursts to hover, and chase the jumps.' : 'Short taps hold the net still. A long hold sends it to the top.';
  }
  portrait($('resFish'), r.sp, won ? null : { sil: '#cdb98a' });
  card.classList.remove('hidden'); cardOpen = true; cardAt = T;
}

function openJournal() {
  if (S.state === 'fight') return;
  var g = $('jGrid'); g.innerHTML = '';
  var kinds = 0;
  SPECIES.forEach(function (sp) {
    var rec = save.best[sp.id], cell = document.createElement('div'); cell.className = 'cell' + (rec ? '' : ' unknown');
    var cvs = document.createElement('canvas'); cvs.width = 220; cvs.height = 120; cell.appendChild(cvs);
    var nm = document.createElement('b'); nm.textContent = rec ? sp.name : 'Not caught yet'; cell.appendChild(nm);
    var sm = document.createElement('small'); sm.textContent = rec ? 'x' + rec.n + ', best ' + fmtKg(rec.kg) : TIERS[sp.tier].name + ' sea, price ' + (sp.mood > 0 ? 'rising' : 'falling'); cell.appendChild(sm);
    g.appendChild(cell); portrait(cvs, sp, rec ? { wag: 0 } : { sil: '#cdb98a', wag: 0 });
    if (rec) kinds++;
  });
  $('jStats').textContent = kinds + ' of ' + SPECIES.length + ' species. ' + save.total + ' catches, best streak ' + save.bestStreak + ', ' + save.gold + ' gold.';
  $('journal').classList.remove('hidden'); journalOpen = true;
}
function closeJournal() { $('journal').classList.add('hidden'); journalOpen = false; }

function setSound(on) {
  save.sound = on; storeSave();
  var b = $('btnSound'); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on'); b.classList.toggle('off', !on);
  if (audio.master) audio.master.gain.value = on ? 0.5 : 0;
}
function feedNote() {
  var n = $('feedNote');
  if (feed.mode === 'live') n.textContent = 'Live Bitcoin price from ' + feed.src + ', second by second.';
  else if (feed.mode === 'boot') n.textContent = 'Looking for the live Bitcoin price...';
  else n.textContent = 'Replaying real Bitcoin ticks from 10 Nov 2026, 13:24 UTC.' + (feed.blocked ? ' This page is not allowed to open a live price connection.' : '');
}

var pointers = {};
function anyDown() { for (var k in pointers) return true; return false; }
function press() {
  unlockAudio();
  if (journalOpen) return;
  if (S.state === 'intro' || ((S.state === 'landed' || S.state === 'lost') && cardOpen && T - cardAt > 0.35)) { sfx.tap(); cast(); }
}
function bindUI() {
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button') || e.target.closest('.sheet')) return;
    e.preventDefault(); pointers[e.pointerId] = 1; S.hold = true;
    try { stage.setPointerCapture(e.pointerId); } catch (x) {}
    press();
  });
  function up(e) { unlockAudio(); delete pointers[e.pointerId]; S.hold = anyDown() || !!keyHeld; }   // iOS grants sound on finger-up
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up); stage.addEventListener('lostpointercapture', up);
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  stage.addEventListener('touchstart', function (e) { if (!e.target.closest('button') && !e.target.closest('.sheet')) e.preventDefault(); }, { passive: false });
  var keyHeld = false;
  window.addEventListener('keydown', function (e) {
    if (e.code !== 'Space' && e.code !== 'ArrowUp') return;
    if (e.target && e.target.tagName === 'BUTTON') return;
    e.preventDefault(); if (e.repeat) return; keyHeld = true; S.hold = true; press();
  });
  window.addEventListener('keyup', function (e) { if (e.code === 'Space' || e.code === 'ArrowUp') { keyHeld = false; S.hold = anyDown(); } });
  window.addEventListener('blur', function () { pointers = {}; keyHeld = false; S.hold = false; });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { pointers = {}; keyHeld = false; S.hold = false; } });
  $('btnStart').addEventListener('click', function () { unlockAudio(); sfx.tap(); cast(); });
  $('btnAgain').addEventListener('click', function () { unlockAudio(); sfx.tap(); cast(); });
  $('btnJournal').addEventListener('click', function () { unlockAudio(); sfx.tap(); if (journalOpen) closeJournal(); else openJournal(); });
  $('btnCloseJ').addEventListener('click', function () { sfx.tap(); closeJournal(); });
  $('btnSound').addEventListener('click', function () { unlockAudio(); setSound(!save.sound); sfx.tap(); });
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe(stage);
}

var lastTs = 0, noteAcc = 0;
function render() {
  c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, H);
  drawScene(); drawChart(); drawStrip();
  if (cardOpen && S.result && S.result.won) portrait($('resFish'), S.result.sp);
}
function frame(ts) {
  var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
  if (!document.hidden) {
    update(dt); render();
    noteAcc += dt; if (noteAcc > 0.4) { noteAcc = 0; if (S.state === 'intro') feedNote(); $('btnJournal').disabled = S.state === 'fight'; }
  }
  requestAnimationFrame(frame);
}

loadSave(); S.goldShown = save.gold;
layout(); setSound(save.sound); feedNote(); bindUI();
save.runs++; storeSave();
tryLive(0);
if (document.fonts && document.fonts.load) { try { document.fonts.load('20px "Lilita One"'); document.fonts.load('800 12px Nunito'); } catch (e) {} }
window.__htp = { S: S, market: market, feed: feed, save: save, cast: cast, update: update, render: render,
  jump: function (i) { replay = new H_.Replay(tape, i); simSec = 0; market.seed(replay.seedCandles(45)); S.lastPrice = NaN; } };
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
